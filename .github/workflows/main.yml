name: Deploy Nuxt via FTP

on:
  push:
    branches:
      - master # Substitua pela branch que você deseja monitorar

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via lftp
        run: |
          sudo apt-get install -y lftp
          lftp -e "
            set ssl:verify-certificate no;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
            mirror -R --delete . /home/git/projects/newSite;
            bye
          "

