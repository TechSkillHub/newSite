name: Deploy via FTP

on:
  push:
    branches:
      - master  # Substitua pelo branch que você deseja monitorar (ex.: main, master, etc.)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Fazer checkout do código do repositório
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Deploy dos arquivos via FTP
      - name: Deploy files to FTP server
        uses: SamKirkland/FTP-Deploy-Action@4.5.0
        with:
          server: ${{ secrets.FTP_SERVER }}      # O endereço do servidor FTP (ex.: ftp.meusite.com)
          username: ${{ secrets.FTP_USERNAME }}  # O usuário do FTP configurado no Droplet
          password: ${{ secrets.FTP_PASSWORD }}  # A senha do usuário do FTP
          local-dir: ./path-to-your-files         # Caminho local (ex.: ./dist ou ./build)
          server-dir: /path-on-server             # Caminho no servidor FTP (ex.: /var/www/html ou /home/ftpuser)
